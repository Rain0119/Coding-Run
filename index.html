<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三軌無限奔跑遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: stretch;
        }

        h1 {
            display: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
            box-shadow: none;
            cursor: pointer;
            background: linear-gradient(to bottom, #87CEEB, #90EE90);
        }

        .info {
            display: none;
        }

        .score-display {
            font-weight: bold;
            position: fixed;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 5px;
            z-index: 100;
        }

        #score {
            top: 10px;
            left: 10px;
            position: fixed;
        }

        #level {
            top: 50px;
            left: 10px;
            position: fixed;
        }

        #shield {
            top: 90px;
            left: 10px;
            position: fixed;
        }

        #highScore {
            top: 10px;
            right: 10px;
            position: fixed;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            color: white;
            text-align: center;
            z-index: 1000;
            border: 3px solid gold;
        }

        .game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .game-over button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
        }

        .controls {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃 三軌無限奔跑遊戲 🏃</h1>
        
        <div class="instructions">
            <p>🎮 躲避障礙物，盡可能獲得更高分數！</p>
            <div class="controls">
                <p>📱 操作方式：<strong>A/D 鍵</strong> 或 <strong>左/右 方向鍵</strong> 移動</p>
            </div>
        </div>

        <div class="info">
            <div class="score-display">分數: <span id="score">0</span></div>
            <div class="score-display">難度: <span id="level">1</span></div>
            <div class="score-display">🛡️ 護盾: <span id="shield">0</span></div>
            <div class="score-display">最高分: <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="600" height="300"></canvas>

        <div class="game-over" id="gameOverScreen">
            <h2>遊戲結束！</h2>
            <p>最終分數: <span id="finalScore">0</span></p>
            <p>最高分: <span id="maxScore">0</span></p>
            <button onclick="location.reload()">重新開始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲配置
        const TRACK_WIDTH = canvas.width / 3;
        const GROUND_Y = canvas.height - 60;
        const PLAYER_SIZE = 30;
        const OBSTACLE_WIDTH = 35;
        const OBSTACLE_HEIGHT = 40;

        // 遊戲狀態
        let gameState = {
            score: 0,
            highScore: localStorage.getItem('highScore') || 0,
            gameOver: false,
            level: 1,
            speed: 5,
            spawnRate: 0.02,
            playerTrack: 1, // 0: 左, 1: 中, 2: 右
            movementFrame: 0, // 追踪移動後的幀數，延遲碰撞檢測
            shield: 0, // 護盾計數
            coins: 0, // 金幣計數
            scoreMultiplier: 1, // 分數倍率（星星道具）
            multiplierTimer: 0, // 倍率時間計時器
            slowDownTimer: 0 // 減速器時間計時器
        };

        // 玩家物件
        const player = {
            track: 1,
            x: TRACK_WIDTH * 1.5 - PLAYER_SIZE / 2,
            y: GROUND_Y,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            isMoving: false,
            targetTrack: 1
        };

        // 鍵盤狀態
        const keys = {};

        // 障礙物陣列
        let obstacles = [];

        // 道具陣列
        let powerUps = [];

        // 鍵盤狀態追踪（用於邊緣檢測）
        let prevKeys = {};

        // 初始化高分顯示
        document.getElementById('highScore').textContent = gameState.highScore;

        // 事件監聽
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // 處理玩家移動輸入 - 只在按鍵剛按下時移動
        function handlePlayerInput() {
            const isLeftPressed = keys['a'] || keys['arrowleft'];
            const isRightPressed = keys['d'] || keys['arrowright'];
            
            const wasLeftPressed = prevKeys['a'] || prevKeys['arrowleft'];
            const wasRightPressed = prevKeys['d'] || prevKeys['arrowright'];

            // 只有在按鍵從未按下變為按下時才移動（邊緣檢測）
            if (isLeftPressed && !wasLeftPressed) {
                if (player.track > 0) {
                    player.track--;
                    gameState.movementFrame = 2; // 設置延遲幀，讓角色先移動2幀再檢查碰撞
                }
            }
            if (isRightPressed && !wasRightPressed) {
                if (player.track < 2) {
                    player.track++;
                    gameState.movementFrame = 2; // 設置延遲幀，讓角色先移動2幀再檢查碰撞
                }
            }

            // 保存本幀的按鍵狀態供下一幀使用
            prevKeys = { ...keys };
        }

        // 更新玩家位置
        function updatePlayer() {
            player.x = player.track * TRACK_WIDTH + TRACK_WIDTH / 2 - PLAYER_SIZE / 2;
        }

        // 生成障礙物
        function spawnObstacle() {
            if (Math.random() < gameState.spawnRate) {
                // 檢查每條軌道上是否已經有障礙物
                const tracksOccupied = [false, false, false];
                for (let obstacle of obstacles) {
                    // 如果障礙物在可碰撞區域（玩家所在位置附近）
                    if (obstacle.y > canvas.height - 150) {
                        tracksOccupied[obstacle.track] = true;
                    }
                }

                // 如果所有軌道都被占據，則不生成新障礙物
                if (tracksOccupied[0] && tracksOccupied[1] && tracksOccupied[2]) {
                    return;
                }

                // 隨機選擇一條未被占據的軌道（或任意軌道，如果未完全占據）
                const track = Math.floor(Math.random() * 3);
                obstacles.push({
                    track: track,
                    x: track * TRACK_WIDTH + TRACK_WIDTH / 2 - OBSTACLE_WIDTH / 2,
                    y: -OBSTACLE_HEIGHT,
                    width: OBSTACLE_WIDTH,
                    height: OBSTACLE_HEIGHT,
                    speed: gameState.speed
                });
            }
        }

        // 更新障礙物
        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                // 移除超出螢幕的障礙物
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    gameState.score += 10;
                    updateLevel();
                }
            }
        }

        // 生成道具
        function spawnPowerUp() {
            if (Math.random() < 0.005) { // 低概率生成道具
                const track = Math.floor(Math.random() * 3);
                const types = ['coin', 'shield', 'slowDown', 'speedUp', 'star']; 
                // coin: 金幣(+50分), shield: 護盾, slowDown: 減速器, speedUp: 加速器, star: 星星(2倍分數)
                const type = types[Math.floor(Math.random() * types.length)];
                
                powerUps.push({
                    track: track,
                    x: track * TRACK_WIDTH + TRACK_WIDTH / 2 - 15,
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: gameState.speed,
                    type: type
                });
            }
        }

        // 更新道具
        function updatePowerUps() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].y += powerUps[i].speed;

                // 移除超出螢幕的道具
                if (powerUps[i].y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }
        }

        // 道具碰撞檢測
        function checkPowerUpCollision() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                if (
                    player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y
                ) {
                    // 根據道具類型應用效果
                    if (powerUp.type === 'coin') {
                        gameState.score += Math.round(50 * gameState.scoreMultiplier); // 金幣增加50分（乘以倍率）
                        gameState.coins++;
                    } else if (powerUp.type === 'shield') {
                        gameState.shield += 1; // 護盾+1
                    } else if (powerUp.type === 'slowDown') {
                        gameState.speed = Math.max(2, gameState.speed - 1); // 減速，最慢保持2
                        gameState.slowDownTimer = 300; // 減速持續300幀（約5秒）
                        updateObstacleSpeed();
                    } else if (powerUp.type === 'speedUp') {
                        gameState.speed = Math.min(12, gameState.speed + 2); // 加速，最快12
                        updateObstacleSpeed();
                    } else if (powerUp.type === 'star') {
                        gameState.scoreMultiplier = 2; // 分數倍率變為2倍
                        gameState.multiplierTimer = 300; // 倍率持續300幀（約5秒）
                    }
                    powerUps.splice(i, 1);
                    updateLevel();
                }
            }
        }

        // 更新障礙物速度
        function updateObstacleSpeed() {
            for (let obstacle of obstacles) {
                obstacle.speed = gameState.speed;
            }
        }

        // 碰撞檢測 - 使用收縮邊界以確保精確碰撞
        function checkCollision() {
            const collisionMargin = 2; // 碰撞邊界縮小值
            
            for (let obstacle of obstacles) {
                // 玩家碰撞盒（稍微縮小）
                const playerLeft = player.x + collisionMargin;
                const playerRight = player.x + player.width - collisionMargin;
                const playerTop = player.y + collisionMargin;
                const playerBottom = player.y + player.height - collisionMargin;

                // 障礙物碰撞盒（稍微縮小）
                const obstacleLeft = obstacle.x + collisionMargin;
                const obstacleRight = obstacle.x + obstacle.width - collisionMargin;
                const obstacleTop = obstacle.y + collisionMargin;
                const obstacleBottom = obstacle.y + obstacle.height - collisionMargin;

                // 精確的 AABB 碰撞檢測
                if (
                    playerLeft < obstacleRight &&
                    playerRight > obstacleLeft &&
                    playerTop < obstacleBottom &&
                    playerBottom > obstacleTop
                ) {
                    // 如果有護盾，消耗護盾而不是死亡
                    if (gameState.shield > 0) {
                        gameState.shield--;
                        document.getElementById('shield').textContent = gameState.shield;
                        obstacles.splice(obstacles.indexOf(obstacle), 1);
                        return false;
                    }
                    return true;
                }
            }
            return false;
        }

        // 更新難度
        function updateLevel() {
            const newLevel = Math.floor(gameState.score / 100) + 1;
            if (newLevel !== gameState.level) {
                gameState.level = newLevel;
                gameState.speed = 5 + (gameState.level - 1) * 0.5;
                gameState.spawnRate = Math.min(0.02 + (gameState.level - 1) * 0.005, 0.08);
            }
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('shield').textContent = gameState.shield;
        }

        // 繪製玩家
        function drawPlayer() {
            // 身體
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(player.x + 5, player.y + 5, PLAYER_SIZE - 10, PLAYER_SIZE - 10);
            
            // 護盾效果
            if (gameState.shield > 0) {
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, PLAYER_SIZE / 2 + 5, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // 眼睛
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(player.x + 12, player.y + 12, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 23, player.y + 12, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // 繪製障礙物
        function drawObstacles() {
            ctx.fillStyle = '#FF0000';
            for (let obstacle of obstacles) {
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                // 障礙物邊框
                ctx.strokeStyle = '#CC0000';
                ctx.lineWidth = 2;
                ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            }
        }

        // 繪製道具
        function drawPowerUps() {
            for (let powerUp of powerUps) {
                if (powerUp.type === 'coin') {
                    // 金幣 - 黃色圓形
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(powerUp.x + 15, powerUp.y + 15, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // 金幣中間的星號
                    ctx.fillStyle = '#FFA500';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⭐', powerUp.x + 15, powerUp.y + 15);
                } else if (powerUp.type === 'shield') {
                    // 護盾 - 青色盾牌
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.7)';
                    ctx.beginPath();
                    ctx.moveTo(powerUp.x + 15, powerUp.y + 5);
                    ctx.lineTo(powerUp.x + 25, powerUp.y + 12);
                    ctx.lineTo(powerUp.x + 25, powerUp.y + 25);
                    ctx.quadraticCurveTo(powerUp.x + 15, powerUp.y + 28, powerUp.x + 5, powerUp.y + 25);
                    ctx.lineTo(powerUp.x + 5, powerUp.y + 12);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#00FFFF';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (powerUp.type === 'slowDown') {
                    // 減速器 - 藍色烏龜
                    ctx.fillStyle = '#4169E1';
                    ctx.beginPath();
                    ctx.arc(powerUp.x + 15, powerUp.y + 18, 8, 0, Math.PI * 2);
                    ctx.fill();
                    // 龜殼紋理
                    ctx.strokeStyle = '#1E90FF';
                    ctx.lineWidth = 1;
                    for (let j = 0; j < 2; j++) {
                        ctx.beginPath();
                        ctx.arc(powerUp.x + 15, powerUp.y + 18, 4 + j * 2, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    // 龜頭
                    ctx.fillStyle = '#4169E1';
                    ctx.beginPath();
                    ctx.arc(powerUp.x + 15, powerUp.y + 8, 4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (powerUp.type === 'speedUp') {
                    // 加速器 - 紅色火焰（不好的物品）
                    ctx.fillStyle = '#FF4500';
                    ctx.beginPath();
                    ctx.moveTo(powerUp.x + 15, powerUp.y + 5);
                    ctx.lineTo(powerUp.x + 20, powerUp.y + 15);
                    ctx.lineTo(powerUp.x + 17, powerUp.y + 15);
                    ctx.lineTo(powerUp.x + 22, powerUp.y + 25);
                    ctx.lineTo(powerUp.x + 15, powerUp.y + 18);
                    ctx.lineTo(powerUp.x + 13, powerUp.y + 25);
                    ctx.lineTo(powerUp.x + 12, powerUp.y + 15);
                    ctx.lineTo(powerUp.x + 10, powerUp.y + 15);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#FF6347';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (powerUp.type === 'star') {
                    // 星星 - 2倍分數倍率
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 28px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', powerUp.x + 15, powerUp.y + 15);
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(powerUp.x + 15, powerUp.y + 15, 12, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // 繪製軌道
        function drawTracks() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 1; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TRACK_WIDTH, 0);
                ctx.lineTo(i * TRACK_WIDTH, canvas.height);
                ctx.stroke();
            }

            // 繪製地面
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, GROUND_Y + PLAYER_SIZE, canvas.width, canvas.height - GROUND_Y - PLAYER_SIZE);
        }

        // 遊戲結束
        function endGame() {
            gameState.gameOver = true;
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('highScore', gameState.highScore);
            }
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('maxScore').textContent = gameState.highScore;
        }

        // 主遊戲循環
        function gameLoop() {
            if (gameState.gameOver) {
                return;
            }

            // 清空畫布
            ctx.fillStyle = 'rgba(135, 206, 235, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 處理玩家輸入（移動）
            handlePlayerInput();

            // 更新位置
            updatePlayer();
            spawnObstacle();
            updateObstacles();
            spawnPowerUp();
            updatePowerUps();
            checkPowerUpCollision();

            // 更新倍率和減速器計時器
            if (gameState.multiplierTimer > 0) {
                gameState.multiplierTimer--;
            } else {
                gameState.scoreMultiplier = 1; // 倍率時間到期，恢復正常
            }

            if (gameState.slowDownTimer > 0) {
                gameState.slowDownTimer--;
            } else if (gameState.slowDownTimer === 0 && gameState.speed < 5 + (gameState.level - 1) * 0.5) {
                gameState.speed = 5 + (gameState.level - 1) * 0.5; // 恢復原始速度
                updateObstacleSpeed();
            }

            // 減少延遲幀計數
            if (gameState.movementFrame > 0) {
                gameState.movementFrame--;
            }

            // 只有在延遲幀結束後才檢查碰撞（確保角色已移動並渲染）
            if (gameState.movementFrame === 0 && checkCollision()) {
                endGame();
                return;
            }

            // 繪製
            drawTracks();
            drawObstacles();
            drawPowerUps();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        // 開始遊戲
        gameLoop();
    </script>
</body>
</html>
