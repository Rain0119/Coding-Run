<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三軌無限奔跑遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: stretch;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
            box-shadow: none;
            cursor: pointer;
            background: linear-gradient(to bottom, #87CEEB, #90EE90);
        }

        .score-display {
            font-weight: bold;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 5px;
        }

        .info {
            position: fixed;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            gap: 25px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 25px;
            border-radius: 10px;
            justify-content: center;
            align-items: center;
        }

        .game-info-panel {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            gap: 30px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 25px;
            border-radius: 10px;
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .multiplier-display {
            color: #FFD700;
            font-weight: bold;
            font-size: 16px;
        }

        .slowdown-display {
            color: #4169E1;
            font-weight: bold;
        }

        .speedup-display {
            color: #FF4500;
            font-weight: bold;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            color: white;
            text-align: center;
            z-index: 1000;
            border: 3px solid gold;
        }

        .game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .game-over button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
        }

        .title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 500;
            gap: 40px;
        }

        .title-screen h1 {
            display: block;
            font-size: 60px;
            color: white;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.8);
            margin: 0;
            text-align: center;
        }

        .title-screen p {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin: 0;
        }

        .button-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .btn-start {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-settings {
            background: linear-gradient(135deg, #FF9800 0%, #f57c00 100%);
        }

        .btn-settings:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .instructions-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px 35px;
            border-radius: 15px;
            color: white;
            max-width: 500px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }

        .instructions-box h3 {
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .instructions-box .instruction-item {
            font-size: 16px;
            margin: 10px 0;
            text-align: left;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .instructions-box .control-key {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }

        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 600;
            gap: 30px;
        }

        .settings-screen.active {
            display: flex;
        }

        .settings-container {
            background: rgba(102, 126, 234, 0.95);
            padding: 40px;
            border-radius: 20px;
            color: white;
            text-align: center;
            max-width: 400px;
        }

        .settings-container h2 {
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .setting-item {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }

        .setting-item label {
            font-weight: bold;
        }

        .setting-item input[type="range"] {
            width: 150px;
            height: 6px;
            cursor: pointer;
        }

        .btn-close {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            padding: 12px 30px;
            font-size: 16px;
        }

        .btn-close:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }
    </style>
</head>
<body>
    <div class="title-screen" id="titleScreen">
        <h1>🎮 Coding Run 🎮</h1>
        <p>躲避障礙物，蒐集道具，創造新的高分紀錄！</p>
        <div class="instructions-box">
            <h3>🎮 遊玩方法</h3>
            <div class="instruction-item">⚠️ <strong>注意：</strong> 請以全螢幕模式遊玩</div>
            <div class="instruction-item">🕹️ <strong>移動：</strong> 按 <span class="control-key">A/D</span> 或 <span class="control-key">←/→</span> 在三條軌道間切換</div>
            <div class="instruction-item">🏃 <strong>目標：</strong> 躲避BUG，盡可能存活更久</div>
            <div class="instruction-item">⭐ <strong>道具：</strong>
                <div style="margin-left: 30px; font-size: 14px;">
                    🪙 金幣：+50 分 | 🛡️ 防毒軟體：保護一次 | 🐢 減速：降低速度<br/>
                    🔥 SurfShark VPN：增加速度 | ⭐ 星星：2倍分數 5秒
                </div>
            </div>
            <div class="instruction-item">📈 <strong>難度：</strong> 分數越高難度越高</div>
        </div>
        <div class="button-group">
            <button class="btn btn-start" onclick="startGame()">開始遊戲</button>
            <button class="btn btn-settings" onclick="toggleSettings()">⚙️ 設定</button>
        </div>
    </div>

    <div class="settings-screen" id="settingsScreen">
        <div class="settings-container">
            <h2>⚙️ 遊戲設定</h2>
            <div class="setting-item">
                <label>難度倍數：</label>
                <input type="range" id="difficultySlider" min="0.5" max="2" step="0.1" value="1" oninput="updateDifficulty(this.value)">
                <span id="difficultyValue">1.0x</span>
            </div>
            <button class="btn btn-close" onclick="toggleSettings()">返回</button>
        </div>
    </div>

    <div class="container">
        <div class="info">
            <div class="score-display">分數: <span id="score">0</span></div>
            <div class="score-display">難度: <span id="level">1</span></div>
            <div class="score-display">🛡️ 護盾: <span id="shield">0</span></div>
            <div class="score-display">最高分: <span id="highScore">0</span></div>
        </div>

        <div class="game-info-panel" id="gameInfoPanel">
            <div id="multiplierInfo"></div>
            <div id="slowdownInfo"></div>
            <div id="speedupInfo"></div>
        </div>

        <canvas id="gameCanvas" width="600" height="300"></canvas>

        <div class="game-over" id="gameOverScreen">
            <h2>遊戲結束！</h2>
            <p>最終分數: <span id="finalScore">0</span></p>
            <p>最高分: <span id="maxScore">0</span></p>
            <button onclick="location.reload()">重新開始</button>
        </div>
    </div>

        const images = {
            player: null,
            obstacle: null,
            shield: null,
            speedup: null
        };

        let imagesLoaded = 0;
        const totalImages = 4;

        function loadImage(key) {
            const img = new Image();
            img.onload = () => {
                images[key] = img;
                imagesLoaded++;
            };
            img.onerror = () => {
                console.error(`無法載入圖片: ${key}`);
                imagesLoaded++;
            };
            img.src = imageData[key];
        }

        loadImage('player');
        loadImage('obstacle');
        loadImage('shield');
        loadImage('speedup');

        const TRACK_WIDTH = canvas.width / 3;
        const GROUND_Y = canvas.height - 60;
        const PLAYER_SIZE = 50;
        const OBSTACLE_WIDTH = 45;
        const OBSTACLE_HEIGHT = 45;

        let gameStarted = false;
        let difficultyMultiplier = 1;

        let gameState = {
            score: 0,
            displayScore: 0,
            highScore: localStorage.getItem('highScore') || 0,
            gameOver: false,
            level: 1,
            speed: 3,
            baseSpeed: 3,
            spawnRate: 0.01,
            baseSpawnRate: 0.01,
            playerTrack: 1,
            movementFrame: 0,
            shield: 0,
            coins: 0,
            scoreMultiplier: 1,
            multiplierTimer: 0,
            slowDownTimer: 0,
            distanceAccumulator: 0
        };

        const player = {
            track: 1,
            x: TRACK_WIDTH * 1.5 - PLAYER_SIZE / 2,
            y: GROUND_Y - 10,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            isMoving: false,
            targetTrack: 1
        };

        const keys = {};
        let obstacles = [];
        let powerUps = [];
        let prevKeys = {};

        document.getElementById('highScore').textContent = gameState.highScore;

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function startGame() {
            gameStarted = true;
            document.getElementById('titleScreen').style.display = 'none';
            gameLoop();
        }

        function toggleSettings() {
            const settingsScreen = document.getElementById('settingsScreen');
            settingsScreen.classList.toggle('active');
        }

        function updateDifficulty(value) {
            difficultyMultiplier = parseFloat(value);
            document.getElementById('difficultyValue').textContent = value + 'x';
        }

        function handlePlayerInput() {
            const isLeftPressed = keys['a'] || keys['arrowleft'];
            const isRightPressed = keys['d'] || keys['arrowright'];
            
            const wasLeftPressed = prevKeys['a'] || prevKeys['arrowleft'];
            const wasRightPressed = prevKeys['d'] || prevKeys['arrowright'];

            if (isLeftPressed && !wasLeftPressed) {
                if (player.track > 0) {
                    player.track--;
                    gameState.movementFrame = 2;
                }
            }
            if (isRightPressed && !wasRightPressed) {
                if (player.track < 2) {
                    player.track++;
                    gameState.movementFrame = 2;
                }
            }

            prevKeys = { ...keys };
        }

        function updatePlayer() {
            player.x = player.track * TRACK_WIDTH + TRACK_WIDTH / 2 - PLAYER_SIZE / 2;
        }

        function spawnObstacle() {
            if (Math.random() < gameState.spawnRate * difficultyMultiplier) {
                const tracksOccupied = [false, false, false];
                for (let obstacle of obstacles) {
                    if (obstacle.y > canvas.height - 150) {
                        tracksOccupied[obstacle.track] = true;
                    }
                }

                if (tracksOccupied[0] && tracksOccupied[1] && tracksOccupied[2]) {
                    return;
                }

                const track = Math.floor(Math.random() * 3);
                obstacles.push({
                    track: track,
                    x: track * TRACK_WIDTH + TRACK_WIDTH / 2 - OBSTACLE_WIDTH / 2,
                    y: -OBSTACLE_HEIGHT,
                    width: OBSTACLE_WIDTH,
                    height: OBSTACLE_HEIGHT,
                    speed: gameState.speed
                });
            }
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    updateLevel();
                }
            }
        }

        function spawnPowerUp() {
            if (Math.random() < 0.005) {
                const track = Math.floor(Math.random() * 3);
                const types = ['coin', 'shield', 'slowDown', 'speedUp', 'star'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                powerUps.push({
                    track: track,
                    x: track * TRACK_WIDTH + TRACK_WIDTH / 2 - 15,
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: gameState.speed,
                    type: type
                });
            }
        }

        function updatePowerUps() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].y += powerUps[i].speed;

                if (powerUps[i].y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }
        }

        function checkPowerUpCollision() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                if (
                    player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y
                ) {
                    if (powerUp.type === 'coin') {
                        gameState.score += Math.round(50 * gameState.scoreMultiplier);
                        gameState.coins++;
                    } else if (powerUp.type === 'shield') {
                        gameState.shield += 1;
                    } else if (powerUp.type === 'slowDown') {
                        gameState.speed = Math.max(2, gameState.speed - 1);
                        gameState.slowDownTimer = 300;
                        updateObstacleSpeed();
                    } else if (powerUp.type === 'speedUp') {
                        gameState.speed = Math.min(12, gameState.speed + 2);
                        updateObstacleSpeed();
                    } else if (powerUp.type === 'star') {
                        gameState.scoreMultiplier = 2;
                        gameState.multiplierTimer = 300;
                    }
                    powerUps.splice(i, 1);
                    updateLevel();
                }
            }
        }

        function updateObstacleSpeed() {
            for (let obstacle of obstacles) {
                obstacle.speed = gameState.speed;
            }
        }

        function checkCollision() {
            const collisionMargin = 8;
            
            for (let obstacle of obstacles) {
                const playerLeft = player.x + collisionMargin;
                const playerRight = player.x + player.width - collisionMargin;
                const playerTop = player.y + collisionMargin;
                const playerBottom = player.y + player.height - collisionMargin;

                const obstacleLeft = obstacle.x + collisionMargin;
                const obstacleRight = obstacle.x + obstacle.width - collisionMargin;
                const obstacleTop = obstacle.y + collisionMargin;
                const obstacleBottom = obstacle.y + obstacle.height - collisionMargin;

                if (
                    playerLeft < obstacleRight &&
                    playerRight > obstacleLeft &&
                    playerTop < obstacleBottom &&
                    playerBottom > obstacleTop
                ) {
                    if (gameState.shield > 0) {
                        gameState.shield--;
                        document.getElementById('shield').textContent = gameState.shield;
                        obstacles.splice(obstacles.indexOf(obstacle), 1);
                        return false;
                    }
                    return true;
                }
            }
            return false;
        }

        function updateLevel() {
            const smoothLevel = 1 + (gameState.score / 200);
            gameState.level = Math.floor(smoothLevel);
            gameState.speed = gameState.baseSpeed + (smoothLevel - 1) * 0.3;
            gameState.spawnRate = Math.min(gameState.baseSpawnRate + (smoothLevel - 1) * 0.003, 0.08);
            
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('shield').textContent = gameState.shield;
        }

        function updateDisplayScore() {
            const diff = gameState.score - gameState.displayScore;
            
            if (diff > 0) {
                const speed = Math.max(1, Math.floor(diff / 10));
                gameState.displayScore += speed;
            } else if (diff < 0) {
                gameState.displayScore = gameState.score;
            }
            
            document.getElementById('score').textContent = Math.floor(gameState.displayScore);
        }

        function drawPlayer() {
            if (images.player) {
                ctx.drawImage(images.player, player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
            } else {
                ctx.fillStyle = '#4EC9E3';
                ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
            }
            
            if (gameState.shield > 0 && images.shield) {
                const shieldSize = PLAYER_SIZE + 15;
                const shieldOffset = (shieldSize - PLAYER_SIZE) / 2;
                ctx.drawImage(images.shield, player.x - shieldOffset, player.y - shieldOffset, shieldSize, shieldSize);
            } else if (gameState.shield > 0) {
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, PLAYER_SIZE / 2 + 8, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawObstacles() {
            for (let obstacle of obstacles) {
                if (images.obstacle) {
                    ctx.drawImage(images.obstacle, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                } else {
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                }
            }
        }

        function drawPowerUps() {
            for (let powerUp of powerUps) {
                if (powerUp.type === 'coin') {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(powerUp.x + 15, powerUp.y + 15, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#FFA500';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('$', powerUp.x + 15, powerUp.y + 15);
                } else if (powerUp.type === 'shield') {
                    if (images.shield) {
                        ctx.drawImage(images.shield, powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                    }
                } else if (powerUp.type === 'slowDown') {
                    ctx.fillStyle = '#4169E1';
                    ctx.beginPath();
                    ctx.arc(powerUp.x + 15, powerUp.y + 18, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#1E90FF';
                    ctx.lineWidth = 1;
                    for (let j = 0; j < 2; j++) {
                        ctx.beginPath();
                        ctx.arc(powerUp.x + 15, powerUp.y + 18, 4 + j * 2, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#4169E1';
                    ctx.beginPath();
                    ctx.arc(powerUp.x + 15, powerUp.y + 8, 4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (powerUp.type === 'speedUp') {
                    if (images.speedup) {
                        ctx.drawImage(images.speedup, powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                    }
                } else if (powerUp.type === 'star') {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 28px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', powerUp.x + 15, powerUp.y + 15);
                }
            }
        }

        function drawTracks() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 1; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TRACK_WIDTH, 0);
                ctx.lineTo(i * TRACK_WIDTH, canvas.height);
                ctx.stroke();
            }

            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, GROUND_Y + PLAYER_SIZE - 10, canvas.width, canvas.height - GROUND_Y - PLAYER_SIZE + 10);
        }

        function endGame() {
            gameState.gameOver = true;
            gameState.score = Math.floor(gameState.score);
            gameState.highScore = Math.floor(gameState.highScore);
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('highScore', gameState.highScore);
            }
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('maxScore').textContent = gameState.highScore;
        }

        function updateGameInfoPanel() {
            const multiplierInfo = document.getElementById('multiplierInfo');
            const slowdownInfo = document.getElementById('slowdownInfo');
            const speedupInfo = document.getElementById('speedupInfo');

            if (gameState.scoreMultiplier > 1) {
                const timeLeft = Math.ceil(gameState.multiplierTimer / 60);
                multiplierInfo.innerHTML = `<div class="multiplier-display">⭐ 倍率: ${gameState.scoreMultiplier}x (${timeLeft}s)</div>`;
            } else {
                multiplierInfo.innerHTML = '';
            }

            if (gameState.slowDownTimer > 0) {
                const timeLeft = Math.ceil(gameState.slowDownTimer / 60);
                slowdownInfo.innerHTML = `<div class="slowdown-display">🐢 減速中 (${timeLeft}s)</div>`;
            } else {
                slowdownInfo.innerHTML = '';
            }

            if (gameState.speed > 5 + (gameState.level - 1) * 0.5) {
                speedupInfo.innerHTML = `<div class="speedup-display">🔥 加速中</div>`;
            } else {
                speedupInfo.innerHTML = '';
            }
        }

        function gameLoop() {
            if (!gameStarted || gameState.gameOver) {
                return;
            }

            ctx.fillStyle = 'rgba(135, 206, 235, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            handlePlayerInput();
            updatePlayer();
            spawnObstacle();
            updateObstacles();
            spawnPowerUp();
            updatePowerUps();
            checkPowerUpCollision();

            if (gameState.multiplierTimer > 0) {
                gameState.multiplierTimer--;
            } else {
                gameState.scoreMultiplier = 1;
            }

            if (gameState.slowDownTimer > 0) {
                gameState.slowDownTimer--;
            } else if (gameState.slowDownTimer === 0 && gameState.speed < 5 + (gameState.level - 1) * 0.5) {
                gameState.speed = 5 + (gameState.level - 1) * 0.5;
                updateObstacleSpeed();
            }

            gameState.distanceAccumulator += gameState.speed * gameState.scoreMultiplier * difficultyMultiplier;
            
            if (gameState.distanceAccumulator >= 10) {
                const scoreToAdd = Math.floor(gameState.distanceAccumulator / 10);
                gameState.score += scoreToAdd;
                gameState.distanceAccumulator -= scoreToAdd * 10;
            }

            updateLevel();
            updateDisplayScore();

            if (gameState.movementFrame > 0) {
                gameState.movementFrame--;
            }

            if (gameState.movementFrame === 0 && checkCollision()) {
                endGame();
                return;
            }

            updateGameInfoPanel();

            drawTracks();
            drawObstacles();
            drawPowerUps();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
